<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청소년국 | 통합 운영센터</title><link rel="stylesheet" href="common.css"><style>body{display:flex;min-height:100dvh}.sidebar{width:245px;flex:none;background:#13213c;color:white;padding:24px 14px;position:sticky;top:0;height:100dvh;overflow:auto}.brand{padding:8px 12px 26px;font-size:19px;font-weight:850}.brand small{display:block;font-size:11px;color:#9daec6;margin-top:5px}.navbtn{display:block;width:100%;background:none;border:0;text-align:left;color:#bac9dc;padding:12px 14px;border-radius:12px;margin:3px 0;font-size:13px}.navbtn.on,.navbtn:hover{background:#2a3d60;color:white}.workspace{flex:1;min-width:0;padding:30px;max-width:1700px}.apphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.apphead h1{font-size:25px;margin:0}.productpic{width:42px;height:42px;object-fit:cover;border-radius:9px;background:#eef1f7}.status-on{color:#169466;font-weight:850}.status-off{color:#8791a1}.mobilebar{display:none}#login{max-width:440px;margin:9vh auto}#app{display:none}.actionrow{display:flex;gap:6px;align-items:center}.sheetrow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #eee}.alertdot{display:inline-block;min-width:20px;text-align:center;background:#f05252;color:white;border-radius:20px;margin-left:5px;font-size:11px;padding:3px 5px}@media(max-width:800px){body{display:block}.sidebar{width:100%;height:auto;position:static;padding:12px;display:flex;align-items:center;overflow-x:auto;gap:4px}.brand{min-width:118px;font-size:14px;padding:5px}.brand small{display:none}.navbtn{white-space:nowrap;width:auto;padding:10px}.workspace{padding:15px}.apphead h1{font-size:19px}}</style></head><body><aside class="sidebar"><div class="brand">◉ 청소년국<small>통합 운영센터 · V2</small></div><button class="navbtn on" data-view="dashboard">대시보드</button><button class="navbtn" data-view="products">전체 상품</button><button class="navbtn" data-view="catalog">온라인 공개</button><button class="navbtn" data-view="inventory">재고·입출고</button><button class="navbtn" data-view="orders">주문·입금·배송 <span id="newCount"></span></button><button class="navbtn" data-view="rentals">렌탈·반납</button><button class="navbtn" data-view="sheets">사용자 시트</button><button class="navbtn" data-view="categories">분류 관리</button><button class="navbtn" data-view="accounts">입금 계좌</button><button class="navbtn" data-view="settings">환경설정</button></aside><main class="workspace"><div id="login" class="panel"><h2>관리자 로그인</h2><p class="muted">기존 Supabase 프로젝트의 Auth 관리자 계정으로 로그인합니다.</p><form id="loginForm" class="stack"><label class="field">이메일<input type="email" id="email" required></label><label class="field">비밀번호<input type="password" id="password" required></label><button class="btn primary">로그인</button><p id="loginMsg" class="hint"></p></form></div><div id="app"><header class="apphead"><h1 id="viewTitle">대시보드</h1><div class="row"><span id="syncStatus" class="muted" style="font-size:12px"></span><button class="btn sm" id="reloadBtn">새로고침</button><button class="btn sm" id="logoutBtn">로그아웃</button></div></header><div id="view"></div></div></main><div id="dialogRoot"></div><div id="toastRoot"></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="admin.js"></script></body></html>
