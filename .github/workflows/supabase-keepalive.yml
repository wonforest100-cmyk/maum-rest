name: Supabase 휴면 방지

on:
  schedule:
    - cron: '7 0 */2 * *'   # 2일마다 한국 시간 09:07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Supabase 접속
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          AUTH=()
          case "$SUPABASE_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_KEY");; esac
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}' || echo 000)
            echo "시도 $i: HTTP $code $(cat resp.txt 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          exit 1

      - uses: actions/checkout@v4

      - name: 저장소 활동 기록 (매달 1일 → 60일 정지 방지)
        run: |
          day=$(TZ=Asia/Seoul date +%d)
          if [ "$day" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          mkdir -p keepalive
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST' > keepalive/last-ping.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive/last-ping.txt
          git commit -m "keepalive: $(cat keepalive/last-ping.txt)" || exit 0
          git push
