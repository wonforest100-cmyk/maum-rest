# 저장 위치: GitHub 저장소의 .github/workflows/supabase-keepalive.yml
# 3일마다 Supabase에 요청을 보내 7일 휴면을 미리 막습니다.
name: Supabase Keepalive

on:
  schedule:
    - cron: "0 0 */3 * *"   # 3일마다 (한국시간 오전 9시)
  workflow_dispatch:          # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: https://adbpxqyjbqrquoqqjqst.supabase.co
          SUPABASE_KEY: sb_publishable_x5fuOEW_J-UHLyKSPnighg_TbZdbUce
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/inventory_state?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase가 응답하지 않습니다. 휴면 상태인지 대시보드에서 확인하세요."
            exit 1
          fi
